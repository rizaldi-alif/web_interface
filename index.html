<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/output.css" />
  </head>
  <body class="font-display">
    <nav
      class="bg-blue-500 shadow-lg border-b border-b-gray-300 py-2 sticky top-0"
    >
      <div class="max-w-[375px] mx-auto">
        <h1 class="text-3xl font-semibold text-white text-center">IoT Labs</h1>
      </div>
    </nav>
    <main class="max-w-[375px] mx-auto p-4">
      <div class="grid grid-cols-2 gap-2">
        <!-- Card -->
        <div
          class="bg-gradient-to-r col-span-2 from-blue-500 to-purple-600 rounded-xl shadow-lg p-4 grid grid-cols-2 gap-4"
        >
          <div class="flex flex-col items-center gap-2 text-white">
            <div class="flex flex-row items-end justify-center text-3xl">
              <span class="material-icons md-36">device_thermostat</span>
              <p class="text-base font-medium">25&deg;</p>
            </div>
            <p class="font-bold">Temperature</p>
          </div>
          <div class="flex flex-col items-center gap-2 text-white">
            <div class="flex flex-row items-end justify-center text-3xl">
              <span class="material-icons md-36">water_drop</span>
              <p class="text-base font-medium">30%</p>
            </div>
            <p class="font-bold">Humidity</p>
          </div>
        </div>
        <!-- Card -->
        <div
          class="bg-gradient-to-r from-blue-500 to-purple-600 rounded-xl shadow-lg p-4 flex flex-col items-center text-white"
        >
          <div class="flex flex-col items-center gap-2 text-white">
            <div class="flex flex-row items-end justify-center text-3xl">
              <span class="material-icons md-36">air</span>
              <p class="text-sm font-medium ml-2">1000 PPM</p>
            </div>
            <p class="font-bold">CO2</p>
          </div>
        </div>
        <div
          class="bg-gradient-to-r from-blue-500 to-purple-600 rounded-xl shadow-lg p-4 flex flex-col items-center text-white"
        >
          <span class="material-icons md-48">work_history</span>
          <p class="font-bold text-sm">Work In Progress</p>
        </div>
      </div>
    </main>
    <nav
      class="bg-blue-500 border-t border-t-gray-300 py-2 px-4 fixed bottom-0 right-0 left-0 w-full shadow-botnav"
    >
      <div class="max-w-[375px] mx-auto flex items-center justify-between">
        <div class="text-center text-2xl text-gray-100">
          <a href="/" class="flex flex-col">
            <span class="material-icons md-24">home</span>
            <p class="text-sm">Dashboard</p>
          </a>
        </div>
        <div class="text-center text-2xl text-gray-300">
          <a href="/controls.html" class="flex flex-col">
            <span class="material-icons md-24">tune</span>
            <p class="text-sm">Controls</p>
          </a>
        </div>
        <div class="text-center text-2xl text-gray-300">
          <a href="/" class="flex flex-col">
            <span class="material-icons md-24">settings</span>
            <p class="text-sm">Settings</p>
          </a>
        </div>
        <div class="text-center text-2xl text-gray-300">
          <a href="/" class="flex flex-col items-center">
            <span class="material-icons md-24">account_circle</span>
            <p class="text-sm">Account</p>
          </a>
        </div>
      </div>
    </nav>
  </body>
</html>
