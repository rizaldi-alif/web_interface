<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lamp Control</title>
    <link rel="stylesheet" href="./src/output.css" />
  </head>
  <body class="font-display">
    <!-- topbar -->
    <nav
      class="bg-blue-500 shadow-lg border-b border-b-gray-300 py-2 sticky top-0"
    >
      <div class="max-w-[375px] mx-auto">
        <h1 class="text-3xl font-semibold text-white text-center">IoT Labs</h1>
      </div>
    </nav>
    <!-- main section -->
    <main class="max-w-[375px] mx-auto p-4">
      <div class="grid grid-cols-2 gap-2">
        <div
          class="bg-gradient-to-l from-blue-500 to-purple-600 rounded-xl shadow-lg p-4 flex flex-col items-center text-white"
        >
          <h3 class="font-bold text-xl text-center">Kitchen</h3>
          <span class="material-icons md-60">kitchen</span>
          <p class="text-base mt-2">
            Status:
            <span id="kitchen-led-status" class="text-red-600 font-bold"
              >On</span
            >
          </p>
          <button
            class="bg-white text-blue-600 font-semibold px-4 py-2 rounded-lg hover:bg-gray-200 transition"
          >
            Toggle
          </button>
        </div>
        <div
          class="bg-gradient-to-l from-blue-500 to-purple-600 rounded-xl shadow-lg p-4 flex flex-col items-center text-white"
        >
          <h3 class="font-bold text-xl text-center">Bedroom</h3>
          <span class="material-icons md-60">hotel</span>
          <p class="text-base mt-2">
            Status:
            <span id="bedroom-led-status" class="text-red-600 font-bold"
              >On</span
            >
          </p>
          <button
            class="bg-white text-blue-600 font-semibold px-4 py-2 rounded-lg hover:bg-gray-200 transition"
          >
            Toggle
          </button>
        </div>
        <div
          class="bg-gradient-to-l from-blue-500 to-purple-600 rounded-xl shadow-lg p-4 flex flex-col items-center text-white"
        >
          <h3 class="font-bold text-xl text-center">Bathroom</h3>
          <span class="material-icons md-60">bathtub</span>
          <p class="text-base mt-2">
            Status:
            <span id="bathtub-led-status" class="text-red-600 font-bold"
              >On</span
            >
          </p>
          <button
            class="bg-white text-blue-600 font-semibold px-4 py-2 rounded-lg hover:bg-gray-200 transition"
          >
            Toggle
          </button>
        </div>
      </div>
    </main>
    <!-- bottom nav -->
    <nav
      class="bg-blue-500 border-t border-t-gray-300 py-2 px-4 fixed bottom-0 right-0 left-0 w-full shadow-botnav"
    >
      <div class="max-w-[375px] mx-auto flex items-center justify-between">
        <div class="text-center text-2xl text-gray-300">
          <a href="/" class="flex flex-col">
            <span class="material-icons md-24">home</span>
            <p class="text-sm">Dashboard</p>
          </a>
        </div>
        <div class="text-center text-2xl text-gray-100">
          <a href="/controls.html" class="flex flex-col">
            <span class="material-icons md-24">tune</span>
            <p class="text-sm">Controls</p>
          </a>
        </div>
        <div class="text-center text-2xl text-gray-300">
          <a href="/" class="flex flex-col">
            <span class="material-icons md-24">settings</span>
            <p class="text-sm">Settings</p>
          </a>
        </div>
        <div class="text-center text-2xl text-gray-300">
          <a href="/" class="flex flex-col items-center">
            <span class="material-icons md-24">account_circle</span>
            <p class="text-sm">Account</p>
          </a>
        </div>
      </div>
    </nav>
  </body>
</html>
