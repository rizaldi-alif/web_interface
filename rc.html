<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remote Control Cars</title>
    <link rel="stylesheet" href="./src/output.css" />
    <script src="./src/js/nipplejs.min.js" type="text/javascript"></script>
  </head>
  <body class="font-display">
    <!-- topbar -->
    <nav
      class="bg-blue-500 shadow-lg border-b border-b-gray-300 py-2 sticky top-0"
    >
      <div class="max-w-[375px] mx-auto">
        <h1 class="text-3xl font-semibold text-white text-center">IoT Labs</h1>
      </div>
    </nav>
    <!-- main section -->
    <main class="max-w-[375px] mx-auto p-4">
      <div class="grid grid-cols-2 gap-2">
        <div
          class="bg-gradient-to-r from-blue-500 to-purple-600 rounded-xl shadow-lg p-2 flex flex-row items-center gap-2 text-white"
        >
          <span class="material-icons md-60">play_arrow</span>
          <p class="">
            Playtime: <span id="hour">00</span>:<span id="minute">00</span
            >:<span id="second">00</span>
          </p>
        </div>
        <div
          class="grid grid-cols-2 text-sm bg-gradient-to-r from-blue-500 to-purple-600 rounded-xl shadow-lg p-2 items-center text-white"
        >
          <div class="">
            <h3 class="text-center">Left Motor</h3>
            <p class="text-center">
              Speed: <span id="left-motor-speed">0</span>%
            </p>
          </div>
          <div class="">
            <h3 class="text-center">Right Motor</h3>
            <p class="text-center">
              Speed: <span id="right-motor-speed">0</span>%
            </p>
          </div>
        </div>
        <div
          class="bg-gradient-to-r from-blue-500 to-purple-600 rounded-xl shadow-lg p-2 flex flex-row items-center text-white gap-2"
        >
          <span class="material-icons md-60">directions</span>
          <p class="flex flex-col">
            Direction: <span id="car-direction">Stand By</span>
          </p>
        </div>
        <div
          class="bg-gradient-to-r from-blue-500 to-purple-600 rounded-xl shadow-lg p-2 flex flex-row items-center text-white gap-2"
        >
          <span class="material-icons md-60">fence</span>
          <p class="flex flex-col">
            Obs. Dist: <span id="obs-dist">0 cm</span>
          </p>
        </div>
      </div>
    </main>
    <div id="joystick-container"></div>
    <!-- bottom nav -->
    <nav
      class="bg-blue-500 border-t border-t-gray-300 py-2 px-4 fixed bottom-0 right-0 left-0 w-full shadow-botnav"
    >
      <div class="max-w-[375px] mx-auto flex items-center justify-between">
        <div class="text-center text-2xl text-gray-300">
          <a href="/" class="flex flex-col">
            <span class="material-icons md-24">home</span>
            <p class="text-sm">Dashboard</p>
          </a>
        </div>
        <div class="text-center text-2xl text-gray-100">
          <a href="/controls.html" class="flex flex-col">
            <span class="material-icons md-24">tune</span>
            <p class="text-sm">Controls</p>
          </a>
        </div>
        <div class="text-center text-2xl text-gray-300">
          <a href="/" class="flex flex-col">
            <span class="material-icons md-24">settings</span>
            <p class="text-sm">Settings</p>
          </a>
        </div>
        <div class="text-center text-2xl text-gray-300">
          <a href="/" class="flex flex-col items-center">
            <span class="material-icons md-24">account_circle</span>
            <p class="text-sm">Account</p>
          </a>
        </div>
      </div>
    </nav>
    <!-- main.js -->
    <script src="./src/js/main.js" type="text/javascript"></script>
    <script src="./src/js/controller.js" type="text/javascript"></script>
  </body>
</html>
