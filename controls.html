<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control Menu</title>
    <link rel="stylesheet" href="./src/output.css" />
  </head>
  <body class="font-display">
    <nav
      class="bg-blue-500 shadow-lg border-b border-b-gray-300 py-2 sticky top-0"
    >
      <div class="max-w-[375px] mx-auto">
        <h1 class="text-3xl font-semibold text-white text-center">IoT Labs</h1>
      </div>
    </nav>
    <main class="max-w-[375px] mx-auto p-4">
      <div class="grid grid-cols-2 gap-2">
        <div
          class="bg-gradient-to-r from-blue-500 to-purple-600 rounded-xl shadow-lg p-4 flex flex-col items-center"
        >
          <span class="material-icons md-60 text-white">wind_power</span>
          <button
            class="mt-2 bg-white text-blue-600 font-semibold px-4 py-2 rounded-lg hover:bg-gray-200 transition"
          >
            Fan Control
          </button>
        </div>
        <div
          class="bg-gradient-to-r from-blue-500 to-purple-600 rounded-xl shadow-lg p-4 flex flex-col items-center"
        >
          <span class="material-icons md-60 text-white">lightbulb</span>
          <a
            href="/lamp.html"
            class="mt-2 bg-white text-blue-600 font-semibold px-4 py-2 rounded-lg hover:bg-gray-200 transition"
          >
            Lamp Control
          </a>
        </div>
        <div
          class="bg-gradient-to-r from-blue-500 to-purple-600 rounded-xl shadow-lg p-4 flex flex-col items-center"
        >
          <span class="material-icons md-60 text-white">videogame_asset</span>
          <a
            href="/rc.html"
            class="mt-2 bg-white text-blue-600 font-semibold px-4 py-2 rounded-lg hover:bg-gray-200 transition"
          >
            RC Car
          </a>
        </div>
        <div
          class="bg-gradient-to-r from-blue-500 to-purple-600 rounded-xl shadow-lg p-4 flex flex-col items-center"
        >
          <span class="material-icons md-60 text-white">door_front</span>
          <a
            href="/led.html"
            class="mt-2 bg-white text-blue-600 font-semibold px-4 py-2 rounded-lg hover:bg-gray-200 transition"
          >
            Smart Door
          </a>
        </div>
        <div
          class="col-span-2 bg-gradient-to-r from-blue-500 to-purple-600 rounded-xl shadow-lg p-4 flex flex-col items-center"
        >
          <span class="material-icons md-60 text-white">work_history</span>
          <button
            class="mt-2 bg-white text-blue-600 font-semibold px-4 py-2 rounded-lg hover:bg-gray-200 transition"
          >
            Work in progress
          </button>
        </div>
      </div>
    </main>
    <nav
      class="bg-blue-500 border-t border-t-gray-300 py-2 px-4 fixed bottom-0 right-0 left-0 w-full shadow-botnav"
    >
      <div class="max-w-[375px] mx-auto flex items-center justify-between">
        <div class="text-center text-2xl text-gray-300">
          <a href="/" class="flex flex-col">
            <span class="material-icons md-24">home</span>
            <p class="text-sm">Dashboard</p>
          </a>
        </div>
        <div class="text-center text-2xl text-gray-100">
          <a href="/controls.html" class="flex flex-col">
            <span class="material-icons md-24">tune</span>
            <p class="text-sm">Controls</p>
          </a>
        </div>
        <div class="text-center text-2xl text-gray-300">
          <a href="/" class="flex flex-col">
            <span class="material-icons md-24">settings</span>
            <p class="text-sm">Settings</p>
          </a>
        </div>
        <div class="text-center text-2xl text-gray-300">
          <a href="/" class="flex flex-col items-center">
            <span class="material-icons md-24">account_circle</span>
            <p class="text-sm">Account</p>
          </a>
        </div>
      </div>
    </nav>
  </body>
</html>
